<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>테런 스토리</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--sf:#fff;--tx:#23212a;--mu:#6d6a78;--bd:#dedbe6;--ac:#7c5cd6;--ac2:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15131c;--sf:#201d2b;--tx:#ece9f5;--mu:#9a96ab;--bd:#35314a;--ac:#9d86f0;--ac2:#15131c}}
:root[data-theme=dark]{--bg:#15131c;--sf:#201d2b;--tx:#ece9f5;--mu:#9a96ab;--bd:#35314a;--ac:#9d86f0;--ac2:#15131c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0 8px 0 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.tab{border:1px solid var(--bd);background:var(--sf);border-radius:20px;padding:4px 13px;white-space:nowrap}
.tab.on{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
#q{flex:1;min-width:140px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;padding:6px 10px;font:inherit}
main{max-width:980px;margin:0 auto;padding:14px}
details{background:var(--sf);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}
summary{padding:11px 14px;font-weight:600;cursor:pointer}summary small{color:var(--mu);font-weight:400;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;padding:0 12px 12px}
.card{text-align:left;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:9px 11px}
.card:hover{border-color:var(--ac)}.card b{display:block}.card span{display:block;color:var(--mu);font-size:12.5px;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.rd b::after{content:" ✓";color:var(--ac)}
.hit{width:100%;text-align:left;border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:9px 12px;margin-bottom:6px}.hit small{color:var(--mu)}.hit mark{background:#ffd84d66;color:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.talk{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:6px;white-space:pre-line}.talk small{color:var(--mu)}

#pl.on{display:flex}
#bar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#000c;z-index:3;flex-wrap:wrap}
#bar button{background:#ffffff1f;border:0;border-radius:8px;padding:4px 10px;color:#fff}#bar button.on{background:var(--ac);color:var(--ac2)}
#ttl{flex:1;min-width:80px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}
#prog{height:3px;background:#ffffff25}#prog i{display:block;height:100%;width:0;background:var(--ac)}
#st{position:relative;flex:1;overflow:hidden;transition:background .6s}
#bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;display:flex;align-items:center;justify-content:center}#bg .bg-blur{position:absolute;inset:-28px;display:flex;filter:blur(24px);opacity:.9;transform:scale(1.04)}#bg .bg-blur img{width:50%;height:100%;flex:1 1 50%;object-fit:cover}#bg>img{position:relative;z-index:1;top:auto;left:auto;right:auto;display:block;flex:none;width:auto;height:auto;max-width:none;max-height:none;object-fit:contain}#bgn{position:absolute;left:10px;top:8px;font-size:11px;opacity:.45;z-index:1}

.ch{position:absolute;bottom:0;transform:translateX(-50%);width:min(30vw,170px);text-align:center;transition:left .4s,opacity .3s,filter .3s;opacity:.55;filter:brightness(.6)}

#tx.nar{font-style:italic;color:#e8e4f5}
#nx{position:absolute;right:5vw;bottom:10px;opacity:.7;animation:bl 1s infinite}@keyframes bl{50%{opacity:.1}}
#cho{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:#000a;padding:20px}
#cho button{width:min(560px,92%);background:#fff;color:#222;border:0;border-radius:12px;padding:12px 16px;font-size:17px}#cho button:hover{background:var(--ac);color:var(--ac2)}
#lg{position:absolute;inset:0;z-index:6;background:#000e;overflow:auto;padding:16px 5vw;display:none}#lg p{margin:0 0 10px}#lg b{color:var(--ac)}
#end{position:absolute;inset:0;z-index:5;background:#000d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:20px}
#end button{background:var(--ac);color:var(--ac2);border:0;border-radius:10px;padding:8px 18px}
#volctl{display:flex;align-items:center;gap:5px;background:#ffffff1f;border-radius:8px;padding:2px 7px;color:#fff;font-size:12px;white-space:nowrap}#vol{width:82px;accent-color:var(--ac);cursor:pointer}#preload:disabled{opacity:.65;cursor:wait}
</style></head><body>

ko:{appTitle:'테런 스토리',search:'대사·제목 검색 (2자 이상)',preload:'⬇️ 자료 미리 불러오기',preloadTitle:'스토리·이미지·캐릭터·오디오 리소스를 브라우저에 미리 저장',loading:'데이터 불러오는 중…',loadFail:'불러오기 실패:',readTextFail:'Text_Dialog 파일을 읽지 못했습니다 ({0})',readMissing:'읽지 못한 파일: ',chapters:'화',back:'← 목록',previous:'◀ 이전 화',undo:'↩ 되돌리기',log:'로그',auto:'오토',skip:'스킵',heroMale:'주인공 ♂',heroFemale:'주인공 ♀',volume:'전체 음량',next:'다음 화 ▶',nextShort:'다음 화',toList:'목록으로',end:'— 끝 —',touch:'터치/상호작용',defaultTalk:'기본',chooseCharacter:'캐릭터를 선택하세요.',noResults:'검색 결과가 없습니다.',choice:'선택',noLog:'기록 없음',main:'메인 스토리',sub:'서브 스토리',affinity:'호감도 스토리',birthday:'생일 스토리',other:'기타',talk:'로비 대화',preloadUnsupported:'이 브라우저는 리소스 미리 불러오기를 지원하지 않습니다.',readingManifest:'리소스 목록 읽는 중…',manifestFail:'asset_manifest.json을 읽을 수 없습니다 (HTTP {0})',storageConfirm:'전체 리소스는 약 {0}입니다.\n현재 브라우저에서 사용 가능한 공간은 약 {1}로 예상됩니다.\n그래도 미리 불러오기를 시작할까요? 공간이 부족하면 이미 저장된 항목은 유지됩니다.',progress:'미리 불러오기 {0}/{1} · {2}',cached:'리소스 {0}/{1}개를 저장했습니다 (약 {2}).',quota:'브라우저 저장 공간이 부족하여 나머지 다운로드를 중단했습니다.',failed:'불러오기에 실패한 항목: {0}개.',cachedHint:'페이지를 다시 열거나 새로고침하면 저장된 리소스를 우선 사용합니다.',partial:'⚠️ 일부 리소스 저장 완료',preloadDone:'✓ 미리 불러오기 완료',preloadFail:'⚠️ 미리 불러오기 실패',preloadError:'리소스 미리 불러오기에 실패했습니다: {0}',language:'中文'},

function applyLanguage(){document.documentElement.lang=uiLang==='zh'?'zh-Hant':'ko';document.title=t('appTitle');$('#appTitle').textContent='📖 '+t('appTitle');$('#q').placeholder=t('search');$('#preload').textContent=t('preload');$('#preload').title=t('preloadTitle');$('#lang').textContent=t('language');$('#bk').textContent=t('back');$('#pv').textContent=t('previous');$('#b1').textContent=t('undo');$('#b2').textContent=t('log');$('#b3').textContent=t('auto');$('#b4').textContent=t('skip');$('#b5').textContent=gender?t('heroMale'):t('heroFemale');$('#volctl').title=t('volume');$('#nxs').textContent=t('next');$('#e1').textContent=t('nextShort');$('#e2').textContent=t('toList');$('#endLabel').textContent=t('end');if(DB){tabs();if($('#pl').classList.contains('on')){const item=allStories.find(x=>x.id===String(cur));if(item)$('#ttl').textContent=item.title}}}
const CATEGORY_LABELS={main:'main',sub:'sub',fr:'affinity',bd:'birthday',etc:'other',talk:'talk'};
const categoryName=c=>CATEGORY_LABELS[c.k]?t(CATEGORY_LABELS[c.k]):c.n;
const E={200:'😐',201:'😠',202:'😑',203:'😢',204:'😊',205:'😡',206:'😭',207:'😄',208:'🙂',209:'😲',210:'🤬'},POS={L:'25%',C:'50%',R:'75%'};
let DB,cat=0,cur=null,list=[],allStories=[],sc,stack,hist,gender=1,auto=0,skip=0,typ=null,tmr=null,total=1,read={},bgmAudio=null,bgmKey='',sfxAudios=[];

 const tr=JSON.parse(await get('story_tree.json','')),sc=JSON.parse(await get('story_scripts.json','')),tx={},miss=[];
 await Promise.all(tr.textFiles.map(async f=>{f=f.replace('{lang}',tr.lang);try{(await get(f,tr.textDir)).replace(/^\uFEFF/,'').split('\n').forEach(l=>{const i=l.indexOf('\t');if(i>0)tx[l.slice(0,i)]=l.slice(i+1).replace(/\r$/,'')})}catch(e){miss.push(f)}}));

const ASSET_CACHE='trrpg-story-assets-v1';
function assetPriority(path){return path.startsWith('./story_')?0:path.startsWith('./TextAsset/')?1:path.startsWith('./Background/')?2:path.startsWith('./Characters/')?3:path.startsWith('./SFX/')?4:path.startsWith('./BGM/')?5:6}
async function preloadAssets(){const button=$('#preload');if(button.disabled)return;if(!('caches'in window)||!('serviceWorker'in navigator)){alert(t('preloadUnsupported'));return}button.disabled=true;const original=t('preload');try{button.textContent=t('readingManifest');const response=await fetch('./asset_manifest.json',{cache:'no-store'});if(!response.ok)throw Error(t('manifestFail',response.status));const manifest=await response.json();const estimate=await navigator.storage?.estimate?.()||{};const free=Number.isFinite(estimate.quota)&&Number.isFinite(estimate.usage)?Math.max(0,estimate.quota-estimate.usage):null;const total=manifest.totalBytes||manifest.files.reduce((n,f)=>n+(f.size||0),0);const fmt=n=>(n/1024/1024/1024).toFixed(2)+' GB';if(free!==null&&free<total&&!confirm(t('storageConfirm',fmt(total),fmt(free)))){button.textContent=original;return}try{await navigator.storage?.persist?.()}catch(e){}const cache=await caches.open(ASSET_CACHE);const files=[...manifest.files].sort((a,b)=>assetPriority(a.url)-assetPriority(b.url)||(a.size||0)-(b.size||0));let done=0,downloaded=0,failed=0,quotaHit=false;const update=()=>{button.textContent=t('progress',done,files.length,fmt(downloaded))};update();for(const file of files){const url=new URL(file.url,document.baseURI).href;try{if(await cache.match(url)){done++;downloaded+=file.size||0;update();continue}const asset=await fetch(url);if(!asset.ok)throw Error('HTTP '+asset.status);await cache.put(url,asset);downloaded+=file.size||0}catch(e){failed++;if(e?.name==='QuotaExceededError'||/quota|storage full/i.test(String(e?.message||e))){quotaHit=true;break}}done++;update()}const message=t('cached',done,files.length,fmt(downloaded))+(quotaHit?'\n'+t('quota'):'')+(failed?'\n'+t('failed',failed):'')+'\n'+t('cachedHint');button.textContent=quotaHit||failed?t('partial'):t('preloadDone');alert(message)}catch(e){button.textContent=t('preloadFail');alert(t('preloadError',String(e.message||e)))}finally{button.disabled=false;if(button.textContent===original)button.textContent=original}}
$('#preload').onclick=preloadAssets;$('#lang').onclick=()=>{uiLang=uiLang==='ko'?'zh':'ko';try{localStorage.setItem('uiLanguage',uiLang)}catch(e){}applyLanguage();if(!$('#pl').classList.contains('on'))show()};
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#15131c';r.dataset.theme=d?'light':'dark'};
document.addEventListener('keydown',e=>{if(!$('#pl').classList.contains('on'))return;if(['Enter',' ','ArrowRight'].includes(e.key)){e.preventDefault();adv()}else if(e.key=='ArrowLeft')back();else if(e.key=='Escape')$('#bk').click()});
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./service-worker.js').catch(e=>console.warn('Service worker registration failed:',e));
applyLanguage();load();
</script></body></html>
